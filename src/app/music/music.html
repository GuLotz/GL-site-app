<h2>Gunnar's Music</h2>

<mat-card>
  <mat-card-content>
    <div class="playerControls">
      <div class="container player" style="width:300px; height:40px; padding-left:18px; padding-right:18px; text-align: center;">
        <button class="playerButton" style="margin-left: 1px; margin-right: 1px; padding: 5px 5px 0px 5px; " (click)='goToPreviousSong()'>
          <mat-icon aria-hidden="false" aria-label="previous" fontSet="material-icons-outlined">skip_previous</mat-icon>
        </button>
        <button class="playerButton" style="margin-left: 1px; margin-right: 1px; padding: 5px 5px 0px 5px;" (click)='playAudio()'>
          <!-- <span [ngClass]="(playMode==='pausing')?'glyphicon glyphicon-play':'glyphicon glyphicon-pause'" aria-hidden="true"></span> -->
          <div *ngIf="(playMode=='pausing')"><mat-icon fontSet="material-icons-outlined">play_arrow</mat-icon></div>
          <div *ngIf="(playMode!='pausing')"><mat-icon fontSet="material-icons-outlined">pause</mat-icon></div>
        </button>
        <button class="playerButton" style="margin-left: 1px; margin-right: 1px; padding: 5px 5px 0px 5px; " (click)='stopAudio()'>
          <mat-icon aria-hidden="false" aria-label="next" fontSet="material-icons-outlined">stop</mat-icon>
        </button>
        <button class="playerButton" style="margin-left: 1px; margin-right: 1px; padding: 5px 5px 0px 5px; " (click)='goToNextSong()'>
          <mat-icon aria-hidden="false" aria-label="next" fontSet="material-icons-outlined">skip_next</mat-icon>
        </button>
        <button class="likeButton" (click)="onLike()">
          <mat-icon aria-hidden="false" aria-label="next" fontSet="material-icons-outlined">thumb_up</mat-icon>
        </button>
      </div>
      <div class="container playerSlider">
        <mat-slider class="musicSlider"
                    disabled=false
                    max=100
                    min=0
                    step=1
                    discrete="false"
                    showTickMarks=false
                    >
          <input matSliderThumb [(ngModel)]="sliderValue" (valueChange)="onSliderValueChanged($event)" (input)="onInputChange($event)">
        </mat-slider>
        <div style="width: 100px;" class="container playerPosition">
          {{activeSongPosition}} / {{activeSongDuration}}
        </div>
      </div>
    </div>
    <div style="margin: 0 0 0px 0; width: 100%; padding-top:10px;">
      <table style="margin:auto;">
        <tr>
          <td style="text-align: right;">
            Now playing:
          </td>
          <td style="text-align: left;">
            {{songs[activeSong].title}}
          </td>
        </tr>
      </table>
    </div>
    <p>
      <audio #audioPlayer (durationchange)="updateDuration()" (timeupdate)="updateSliderValue()" (ended)="songHasEnded()" style="padding:0;">
        <source src={{songs[activeSong].path}} type="audio/mp3">
        <em class="error"><strong>Error:</strong> Your browser doesn't appear to support HTML5 Audio.</em>
      </audio>
    </p>
  </mat-card-content>
</mat-card>

<div class="container-fluid" style="overflow-y:scroll;height:42vh; margin-bottom:-19px;">
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Song</th>
        <th>Likes</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let song of songs" [ngClass]="(song.id-1==activeSong)?'activeSong':'passiveSong'">
        <td style="width:26px;"> {{ song.id }} </td>
        <td>
          <div class="listSongName" (click)='changeSong(song.id-1)'>{{song.title}}</div>
        </td>
        <td>
          <div>{{song.likes}}</div>
        </td>
      </tr>
    </tbody>
  </table>
</div>
